name: Model request
description: Ask for a change to the Surf Analytics model, report a data problem or flag missing documentation.
title: "[Model] "
labels: ["model"]
body:
  - type: markdown
    attributes:
      value: The answers below are read by the documentation site, so the issue shows up against the right table on the dashboard.
  - type: dropdown
    id: table
    attributes:
      label: Table
      description: Which table is this about? Keep this list in step with the tables in the model.
      options:
        - Whole model
        - FactSession
        - FactSales
        - DimDate
        - DimSpot
        - DimSurfer
        - DimBoard
        - DimProduct
    validations:
      required: true
  - type: dropdown
    id: request-type
    attributes:
      label: Request type
      options:
        - New column or measure
        - Definition change
        - Data quality
        - Documentation gap
        - Question
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What is needed, and why. Name the column or measure if there is one.
    validations:
      required: true

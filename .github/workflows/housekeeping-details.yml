name: Describe housekeeping items

# Housekeeping issues are opened from the rules report with one short checklist line per item, so long lists still
# fit in the "new issue" link. This adds each item's description (the rule, what is breaking it, what the rule is and
# how to fix it) to the issue straight after it is opened. Edits made with the workflow token do not start other
# workflows, so this does not loop.
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  describe:
    if: contains(github.event.issue.body, '(rule:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Add item descriptions
        run: python tools/expand_housekeeping.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCS_BRANCH: ${{ github.event.repository.default_branch }}

name: Record activity and rebuild docs

# Two jobs in one:
# 1. Keep requirement issues in step with their branches (tools/flow.py): label a new requirement, stamp an issue
#    with who took it out when a branch is created, complete it when its pull request is merged, and close or
#    reopen a parent requirement with its sub-requirements.
# 2. Rebuild the site, so the Planning and Work in progress pages show the change. A run started by these events
#    belongs to the branch, and Pages only deploys from the default branch, so this hands off to the publish
#    workflow on the default branch instead of deploying.
# The tools are always taken from the default branch, never from the branch or pull request that started the run.
on:
  create:
  delete:
  push:
    branches-ignore: [main, master]
  pull_request:
    types: [opened, closed, reopened, ready_for_review, converted_to_draft]
  issues:
    types: [opened, closed, reopened]

permissions:
  actions: write
  contents: read
  issues: write

# One run at a time for each issue, pull request or branch; none are cancelled, so no stamp or completion is lost.
concurrency:
  group: activity-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  activity:
    if: github.event_name != 'create' && github.event_name != 'delete' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Update requirement issues
        id: flow
        if: github.event_name == 'issues' || github.event_name == 'create' || (github.event_name == 'pull_request' && github.event.action == 'closed')
        run: python tools/flow.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the publish workflow on the default branch
        # issue events rebuild the site by themselves; only rebuild again if this run changed an issue
        if: github.event_name != 'issues' || steps.flow.outputs.changed == 'true'
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

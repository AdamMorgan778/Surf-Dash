# Project settings for the docs site. Every key is optional; delete a line to get the default.

# Shown in the site header. Default: "<model name> model docs".
site_name: Surf Analytics model docs

# Folder of the semantic model, relative to this file. Only needed when the repository holds more than one
# *.SemanticModel folder, or the model is in a subfolder. Default: the one *.SemanticModel folder at the top level.
# model: SurfAnalytics.SemanticModel

# The fields every table should have in metadata/tables.yaml. The Documentation page lists the ones that are missing.
# Fact tables also need business_process. Default: owner, steward, grain, refresh, sensitivity.
# catalogue_fields: [owner, steward, grain, refresh, sensitivity]

# How long a closed issue stays on the home page, in days. Default: 30.
closed_issue_days: 30

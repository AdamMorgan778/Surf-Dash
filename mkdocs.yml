site_name: !ENV [SITE_NAME, "Model docs"]
site_description: Data dictionary, data catalogue and bus matrix generated from the Power BI semantic model.
repo_url: !ENV REPO_URL
edit_uri: ""

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.expand   # sections are always open, so entries don't move as you change page
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# The sidebar, in a fixed order. The dictionary's table pages are built but not listed: the Data dictionary page
# lists them instead, so a model with many tables does not swamp the sidebar.
nav:
  - Overview: index.md
  - Planning: planning.md
  - Work in progress: work.md
  - Documentation:
      - documentation/index.md
      - Data dictionary: documentation/dictionary/index.md
      - Data catalogue: documentation/catalogue.md
      - Bus matrix: documentation/bus-matrix.md
      - Glossary: documentation/glossary.md
  - Best practice:
      - rules/index.md
      - Rule library: rules/reference.md
  - Surf forecast: surf/index.md
  - Play: play/index.md
  - Using this site: guide.md

not_in_nav: |
  /documentation/dictionary/*.md
  /overview.md

# Adds a version stamp to every script and style address, so browsers fetch them again after a change.
hooks:
  - tools/mkdocs_hooks.py

# Shown in every page footer. tools/build.py sets it to when and by which GitHub Actions run the site was built.
copyright: !ENV [SITE_BUILT, "Built locally"]

extra_css:
  - assets/site.css
  - assets/report.css
  - assets/jetski.css
  - assets/surf.css
extra_javascript:
  - assets/ui.js
  - assets/planning.js
  - assets/home.js
  - assets/documentation.js
  - assets/work.js
  - assets/housekeeping.js
  - assets/rules.js
  - assets/jetski.js
  - assets/surf.js

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
